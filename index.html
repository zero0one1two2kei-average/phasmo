<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phasmo Helper</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <h1>Phasmo Helper</h1>

  <section id="difficulty-section">
    <h2>難易度（証拠の数）</h2>
    <select id="difficulty-select">
      <option value="3">アマチュア / セミプロ / プロ（3つ）</option>
      <option value="2">ナイトメア（2つ）</option>
      <option value="1">インサニティ（1つ）</option>
    </select>
  </section>

  <div id="main-content">
    <div id="left-column">
      <section id="evidence-section">
        <h2>証拠</h2>
        <div id="evidence-list">
          <!-- app.jsで動的に生成 -->
        </div>
      </section>
      <button id="reset-button">リセット</button>
    </div>

    <div id="right-column">
      <section id="result-section">
        <h2>候補ゴースト</h2>
        <div id="ghost-list">
          <!-- app.jsで動的に生成 -->
        </div>
      </section>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
