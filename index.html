<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phasmo Helper</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <h1>Phasmo Helper</h1>
    <nav class="site-nav">
      <a href="index.html" class="nav-link active">🔍 ゴースト判別</a>
      <a href="items.html" class="nav-link">🎒 アイテム一覧</a>
    </nav>
  </header>

  <!-- 難易度選択セクション -->
  <section id="difficulty-section">
    <h2>難易度（証拠の数）</h2>
    <select id="difficulty-select">
      <option value="3">アマチュア / セミプロ / プロ（3つ）</option>
      <option value="2">ナイトメア（2つ）</option>
      <option value="1">インサニティ（1つ）</option>
    </select>
  </section>

  <!-- メインコンテンツ: 左右2カラム -->
  <div id="main-content">

    <!-- 左カラム: 証拠選択エリア -->
    <div id="left-column">
      <section id="evidence-section">
        <h2>証拠</h2>
        <div id="evidence-list"></div>
      </section>
      <button id="reset-button">リセット</button>
    </div>

    <!-- 右カラム: 候補ゴースト表示エリア -->
    <div id="right-column">
      <section id="result-section">
        <h2>候補ゴースト <span id="ghost-count"></span></h2>
        <div id="ghost-list"></div>
      </section>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>

</html>
